[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-capture"
version = "0.2.11"
description = "Readable multi-channel RIR and speech dataset capture tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "sounddevice>=0.5.1",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "XlsxWriter>=3.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
portable = ["PyInstaller>=6.0,<7"]

[project.scripts]
acoustic-capture = "acoustic_capture.cli:main"
acoustic-capture-gui = "acoustic_capture.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
