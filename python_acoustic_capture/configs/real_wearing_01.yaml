audio:
  backend: sounddevice
  host_api: ASIO
  device: null
  input_device: "ASIO Fireface USB"
  output_device: "ASIO Fireface USB"
  sample_rate: 48000
  block_size: 0
  input_channels: [1, 2]
  target_output_channel: 1
  interferer_output_channel: 2
  latency: high
  dtype: float32

sweep:
  start_hz: 40
  end_hz: 22000
  duration_s: 8
  pre_silence_s: 1
  post_silence_s: 3
  fade_in_s: 0.08
  fade_out_s: 0.005
  level_dbfs: -20
  rir_duration_s: 2
  pre_peak_s: 0.01

repeats:
  minimum: 5
  # 最多允许 10 次尝试，直到得到 5 次通过质检的有效 RIR。
  maximum: 10
  correlation_threshold: 0.90
  peak_drift_samples: 2
  minimum_sweep_snr_db: 6.0
  required_stable_takes: 3
  reject_clipped: true
  clip_threshold: 0.999
  pause_s: 1

scene:
  items: [ambient, target_only, interferer_only, mixture]
  source_mode: single
  duration_s: 2.0
  ambient_duration_s: 5
  target_file: ../../Kalman_Filter_for_ANC/Real_Noise/speech@24kHz.wav
  interferer_file: ../../Kalman_Filter_for_ANC/Real_Noise/Traffic.wav
  target_level_dbfs: -20
  interferer_level_dbfs: -20
  repetitions: 5
  capture_strategy: paired_sequence
  require_supervised_pair: true
  countdown_s: 3
  gap_s: 1

storage:
  root: ../runs
  session_name: real_wearing_01
  wav_subtype: FLOAT
  save_playback_reference: true
  compute_sha256: true

metadata:
  wearing_id: wearing_01
  microphone_1: channel_1
  microphone_2: channel_2
  capture_mode: real_rme_asio
  notes: 实验室正式实采；扬声器与双麦克风均连接 RME
