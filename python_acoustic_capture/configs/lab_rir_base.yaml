audio:
  backend: sounddevice
  host_api: ASIO
  device: null
  input_device: ASIO Fireface USB
  output_device: ASIO Fireface USB
  sample_rate: 48000
  block_size: 0
  input_channels:
  - 1
  - 2
  target_output_channel: 1
  interferer_output_channel: 2
  latency: high
  dtype: float32
sweep:
  start_hz: 40
  end_hz: 22000
  duration_s: 8
  pre_silence_s: 1
  post_silence_s: 3
  fade_in_s: 0.08
  fade_out_s: 0.005
  level_dbfs: -20
  rir_duration_s: 2
  pre_peak_s: 0.01
repeats:
  strategy: reconstruct_average
  fixed_count: 5
  correlation_threshold: 0.9
  peak_drift_samples: 2
  minimum_sweep_snr_db: 6.0
  reject_clipped: true
  clip_threshold: 0.999
  pause_s: 1
  reconstruction_policy: diagnostic
storage:
  root: ../runs
  session_name: generated_by_experiment_plan
  wav_subtype: FLOAT
  save_playback_reference: true
  compute_sha256: true
metadata:
  capture_profile: standard
  task_type: rir_for_neural_beamforming
  artificial_head_id: head01
  microphone_1: left
  microphone_2: right
  array:
    array_id: headset_array_template
    coordinate_system: head_center_x_forward_y_left_z_up_m
    reference_point: artificial_head_center
    reference_channel: 1
    geometry_required: false
    channels:
    - recording_channel: 1
      microphone_id: left
      x_m: null
      y_m: null
      z_m: null
      polarity: 1
    - recording_channel: 2
      microphone_id: right
      x_m: null
      y_m: null
      z_m: null
      polarity: 1
  capture_mode: real_rme_asio
  rme_input_gain_ch1_db: null
  rme_input_gain_ch2_db: null
  playback_calibration_spl_db: null
  room_id: lab01
