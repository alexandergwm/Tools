audio:
  backend: sounddevice
  host_api: ASIO
  device: null
  input_device: ASIO Fireface USB
  output_device: ASIO Fireface USB
  sample_rate: 48000
  block_size: 0
  input_channels:
  - 1
  - 2
  target_output_channel: 1
  interferer_output_channel: 2
  latency: high
  dtype: float32
scene:
  items:
  - target_only
  - interferer_only
  - mixture
  source_mode: folders
  duration_s: 4.0
  target_file: ../audio/target.wav
  interferer_file: ../audio/interferer.wav
  target_folder: ../audio/targets
  interferer_folder: ../audio/interferers
  target_index_csv: ''
  interferer_index_csv: ''
  file_extensions:
  - .wav
  - .flac
  label_prefix: speech_pair
  dataset_split: train
  target_level_dbfs: -26.0
  interferer_level_dbfs: -26.0
  repetitions: 1
  capture_strategy: paired_sequence
  require_supervised_pair: true
  countdown_s: 3.0
  gap_s: 1.0
  measurement_count: 10
storage:
  root: ../runs
  session_name: target_interferer_mixed_triplet
  wav_subtype: FLOAT
  save_playback_reference: true
  compute_sha256: true
