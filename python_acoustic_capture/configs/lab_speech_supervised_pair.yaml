audio:
  backend: sounddevice
  host_api: ASIO
  device: null
  # 正式采集：输入和两路输出都选同一个 RME ASIO 双工设备。
  input_device: ASIO Fireface USB
  output_device: ASIO Fireface USB
  sample_rate: 48000
  block_size: 0
  input_channels: [1, 2]
  # 通道 1 接人工嘴；通道 2 接干扰扬声器。mixed 时两路同时发声。
  target_output_channel: 1
  interferer_output_channel: 2
  latency: high
  dtype: float32

scene:
  # 最小严格监督方案：同一连续流内 target_only -> mixture。
  # 不录 interferer_only，节省现场时间。
  items: [target_only, mixture]
  source_mode: folders
  duration_s: 4.0
  target_file: E:\Code_Github\Tools-main\Tools-main\python_acoustic_capture\audio\target.wav
  interferer_file: E:\Code_Github\Tools-main\Tools-main\python_acoustic_capture\audio\interferer.wav
  target_folder: E:\Code_Github\Tools-main\Tools-main\python_acoustic_capture\audio\targets
  interferer_folder: E:\Code_Github\Tools-main\Tools-main\python_acoustic_capture\audio\interferers
  # 可选 CSV：relative_path,speaker_id,utterance_id
  target_index_csv: ''
  # 可选 CSV：relative_path,noise_id,noise_class
  interferer_index_csv: ''
  pairing_mode: cycle
  file_extensions: [.wav, .flac]
  label_prefix: speech_pair
  dataset_split: train
  target_level_dbfs: -26.0
  interferer_level_dbfs: -26.0
  repetitions: 1
  capture_strategy: paired_sequence
  require_supervised_pair: true
  countdown_s: 3.0
  gap_s: 1.0

storage:
  root: E:\Code_Github\Tools-main\Tools-main\python_acoustic_capture\runs
  session_name: target_mixed_pair
  wav_subtype: FLOAT
  save_playback_reference: true
  compute_sha256: true

metadata:
  capture_profile: standard
  task_type: neural_beamforming_and_speech_enhancement
  project_id: headset_speech_generalization_v1
  scene_id: target_mixed_pair
  experiment_type: speech_enhancement
  room_id: ''
  artificial_head_id: headA
  headset_model_id: modelA
  headset_unit_id: hs01
  wearing_id: w01
  boom_pose_id: b00_nominal
  microphone_1: left
  microphone_2: right
  target:
    active: true
    source_id: artificial_mouth_01
    position_id: mouth_fixed
    azimuth_deg: 0
    elevation_deg: 0
    height_m: 1.40
    distance_m: 0.05
  interferer:
    active: true
    source_id: interferer_speaker_01
    position_id: int090_h170_d100
    azimuth_deg: 90
    elevation_deg: 0
    height_m: 1.70
    distance_m: 1.00
